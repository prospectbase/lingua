[package]
name = "lingua-napi"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Node.js bindings for lingua, the natural language detector"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# lingua builds every language model into the binary by default. They are
# compiled in rather than read from files, and a native binary maps them in
# lazily, so only the models a detector touches take up memory.
lingua = "=1.8.0"
napi = { version = "3.14.2", default-features = false, features = ["napi8"] }
napi-derive = "3.6.12"

[build-dependencies]
napi-build = "2.6.0"

[profile.release]
lto = true
strip = "symbols"
